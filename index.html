<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Problems Sheet</title>
    <style>
        /* Styles remain unchanged */
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            margin: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            background-color: #ffeb3b;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        h2 {
            font-size: 28px;
            color: #ff5722;
        }
        #studentInfo {
            margin: 10px 0;
            font-size: 16px;
        }
        #studentInfo input {
            width: 150px;
            margin-right: 10px;
            padding: 5px;
            border: 2px solid #ff5722;
            border-radius: 5px;
        }
        button {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background-color: #45a049;
        }
        label {
            font-size: 16px;
        }
        #apiResult {
            margin-top: 20px;
            padding: 10px;
        }
        .problem-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            justify-items: center;
            margin-top: 20px;
        }
        .problem {
            font-size: 22px;
            text-align: center;
            line-height: 1.6;
            background-color: #e1f5fe;
            border: 2px solid #29b6f6;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
        }
        .equation {
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            color: #ff5722;
        }
        .underline {
            text-decoration: underline;
            display: inline-block;
            width: 80px;
            height: 2px;
            background-color: black;
            margin: 10px 0;
        }
        .answers {
            font-size: 12px;
            color: gray;
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
        .operator {
            color: #ff5722;
            font-weight: bold;
        }
        #answers h3 {
            color: #ff5722;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-btn:hover,
        .close-btn:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .modal label {
            font-size: 14px;
            margin-top: 10px;
            display: block;
        }
        .modal input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .modal button {
            width: 100%;
            background-color: #4caf50;
            padding: 10px;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .modal button:hover {
            background-color: #45a049;
        }

        @media (max-width: 768px) {
            .problem-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            button {
                font-size: 16px;
                padding: 8px 16px;
            }
            h2 {
                font-size: 24px;
            }
            .problem {
                font-size: 20px;
                padding: 8px;
            }
            #studentInfo input {
                width: 100%;
                margin-bottom: 10px;
            }
        }

        @media (max-width: 480px) {
            .problem-grid {
                grid-template-columns: 1fr;
            }
            h2 {
                font-size: 20px;
            }
            .problem {
                font-size: 18px;
            }
            button {
                width: 100%;
                font-size: 14px;
            }
            #studentInfo {
                text-align: center;
            }
            #studentInfo input {
                width: 100%;
                margin-bottom: 5px;
            }
        }

        @media print {
            body {
                background-color: white;
            }
            .problem-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
            .problem {
                font-size: 20px;
                padding: 10px;
                border: 1px solid black;
                box-shadow: none;
            }
            header {
                text-align: left;
                margin-bottom: 0;
                background-color: transparent;
                padding: 0;
            }
            header h2 {
                font-size: 24px;
            }
            #studentInfo {
                display: block;
                margin-bottom: 10px;
            }
            #studentInfo input {
                border: none;
                border-bottom: 1px solid black;
                width: auto;
                padding: 0;
                display: inline-block;
                font-size: 14px;
                color: black;
                font-weight: bold;
            }
            button, label, #showAnswers {
                display: none;
            }
            .answers {
                font-size: 16px;
                display: block;
            }
            .underline {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h2>Math Problem Worksheet</h2>
        <div id="studentInfo">
            Name: <input type="text" placeholder="Student Name">
            Date: <input type="date" placeholder="Date">
            Score: <input type="text" placeholder="Score">
        </div>
    </header>

    <button onclick="showPopup()">Generate Math Problems</button>
    <button onclick="showSpellingsPopup()">Generate Spellings</button>

    <label>
        <input type="checkbox" id="showAnswers"> Show answers in print
    </label>

    <div id="apiResult">
        <!-- API response will be displayed here -->
    </div>

    <button onclick="printPDF()">Print to PDF</button>

    <div id="answers" class="hidden">
        <h3>Answers</h3>
        <div id="answersContent"></div>
    </div>

    <!-- The Modal -->
    <div id="problemModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <form id="problemForm">
                <h2>Enter Problem Details</h2>
                <label for="additions">Number of Additions:</label>
                <input type="number" id="additions" name="additions" placeholder="Additions">

                <label for="subtractions">Number of Subtractions:</label>
                <input type="number" id="subtractions" name="subtractions" placeholder="Subtractions">

                <label for="multiplications">Number of Multiplications:</label>
                <input type="number" id="multiplications" name="multiplications" placeholder="Multiplications">

                <label for="divisions">Number of Divisions:</label>
                <input type="number" id="divisions" name="divisions" placeholder="Divisions">

                <label for="digits">Number of Digits:</label>
                <input type="number" id="digits" name="digits" placeholder="Digits">

                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <script>
        var modal = document.getElementById("problemModal");
        var openModalButton = document.querySelector("button[onclick='showPopup()']");
        var closeModalButton = document.querySelector(".close-btn");
        var form = document.getElementById("problemForm");

        openModalButton.onclick = function() {
            modal.style.display = "block";
        }

        closeModalButton.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            var numOfAdditions = document.getElementById("additions").value|| 0;
            var numOfSubtractions = document.getElementById("subtractions").value|| 0;
            var numOfMultiplications = document.getElementById("multiplications").value|| 0;
            var numOfDivisions = document.getElementById("divisions").value|| 0;
            var numberOfDigits = document.getElementById("digits").value|| 0;

            if (numOfAdditions && numOfSubtractions && numOfMultiplications && numOfDivisions && numberOfDigits) {
                fetchApiData(numOfAdditions, numOfSubtractions, numOfMultiplications, numOfDivisions, numberOfDigits);
                modal.style.display = "none";
            } else {
                alert("Please fill in all the values.");
            }
        });

        async function fetchApiData(numOfAdditions=0, numOfSubtractions=0, numOfMultiplications=0, numOfDivisions=0, numberOfDigits=1) {
            const apiUrl = `https://ip7nw0s528.execute-api.eu-west-1.amazonaws.com/default/problems?num_of_additions=${numOfAdditions}&num_of_subtractions=${numOfSubtractions}&num_of_multiplications=${numOfMultiplications}&num_of_divisions=${numOfDivisions}&number_of_digits=${numberOfDigits}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }

                const data = await response.json();
                displayProblems(data.results);
            } catch (error) {
                console.error('Fetch error:', error);
                alert('There was an error fetching the data.');
            }
        }

        async function fetchSpellings(count=1) {
            const apiUrl = `https://ip7nw0s528.execute-api.eu-west-1.amazonaws.com/default/spellings?number_of_spellings=${count}`; // Replace with the actual API URL
            try {
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }

                const data = await response.json();
                displaySpellings(data.spellings);
            } catch (error) {
                console.error('Fetch error:', error);
                alert('There was an error fetching the spellings.');
            }
        }

        function displayProblems(problems) {
            const apiResultDiv = document.getElementById('apiResult');
            const answersDiv = document.getElementById('answersContent');
            apiResultDiv.innerHTML = '';
            answersDiv.innerHTML = '';

            const gridDiv = document.createElement('div');
            gridDiv.classList.add('problem-grid');

            problems.forEach(problem => {
                const problemDiv = document.createElement('div');
                problemDiv.classList.add('problem');
                problemDiv.innerHTML = `
                    <div class="equation">
                        ${problem.num1}<br>
                        <span class="operator">${getOperator(problem.operation)}</span> ${problem.num2}<br>
                        <div class="underline"></div>
                    </div>
                `;
                gridDiv.appendChild(problemDiv);

                const answerDiv = document.createElement('div');
                answerDiv.innerText = `${problem.num1} ${getOperator(problem.operation)} ${problem.num2} = ${problem.result}`;
                answersDiv.appendChild(answerDiv);
            });

            apiResultDiv.appendChild(gridDiv);
        }

        function getOperator(operation) {
            switch (operation) {
                case '+': return '+';
                case '-': return '-';
                case '*': return 'x';
                case '/': return '÷';
                default: return '?';
            }
        }

        function printPDF() {
            const showAnswers = document.getElementById('showAnswers').checked;
            const answersDiv = document.getElementById('answers');

            if (showAnswers) {
                answersDiv.classList.remove('hidden');
            } else {
                answersDiv.classList.add('hidden');
            }

            window.print();
        }
    </script>

<!-- Spellings Modal -->
<div id="spellingsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn spellings-close">&times;</span>
        <form id="spellingsForm">
            <h2>Enter Spellings Details</h2>
            <label for="spellingsCount">Number of Spellings:</label>
            <input type="number" id="spellingsCount" name="spellingsCount" placeholder="Enter count" required>
            <button type="submit">Submit</button>
        </form>
    </div>
</div>

<div id="spellingsResult">
    <!-- Spellings will be displayed here -->
</div>

<script>
// Spellings Modal functionality
var spellingsModal = document.getElementById("spellingsModal");
var spellingsButton = document.querySelector("button[onclick='showSpellingsPopup()']");
var spellingsClose = document.querySelector(".spellings-close");
var spellingsForm = document.getElementById("spellingsForm");

// Open the modal
function showSpellingsPopup() {
    spellingsModal.style.display = "block";
}

// Close the modal
spellingsClose.onclick = function() {
    spellingsModal.style.display = "none";
}

// Close modal when clicking outside it
window.onclick = function(event) {
    if (event.target == spellingsModal) {
        spellingsModal.style.display = "none";
    }
}

// Fetch and display spellings
spellingsForm.addEventListener("submit", function(event) {
    event.preventDefault();

    // Get input value
    var spellingsCount = document.getElementById("spellingsCount").value || 0;

    // Validate input
    if (spellingsCount > 0) {
        fetchSpellings(spellingsCount);
        spellingsModal.style.display = "none";
    } else {
        alert("Please enter a valid number.");
    }
});


function displaySpellings(spellings) {
    const spellingsResultDiv = document.getElementById('spellingsResult');
    spellingsResultDiv.innerHTML = ''; // Clear previous results

    const list = document.createElement('ol'); // Ordered list
    spellings.forEach(spelling => {
        const listItem = document.createElement('li');
        listItem.textContent = spelling;
        list.appendChild(listItem);
    });

    spellingsResultDiv.appendChild(list);
}
</script>

</body>
</html>
